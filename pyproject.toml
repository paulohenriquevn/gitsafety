[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitsafety"
version = "0.7.4"
description = "Não deixa você commitar uma chave de API."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Paulo Henrique" }]
keywords = ["secrets", "pre-commit", "security", "scanner"]

# Piso 3.10 — ADR D8 do plano do M0. Python 3.9 está EOL desde 2025-10-31, e
# pytest>=9.0.3 (a primeira versão sem GHSA-6w46-j5rx-g56g) exige >=3.10.
requires-python = ">=3.10"

# A ÚNICA dependência de runtime autorizada pelo docs/PRD.md § NFR-1, gasta no M3.
# Piso 6.0.1 (não 6.0): a 6.0 tinha problema de build com Cython 3. Teto no major
# porque uma major nova pode mudar o comportamento de safe_load sem aviso.
# Superfície de uso: UMA função, `yaml.safe_load` (ADR D1 do M3).
# A partir daqui o orçamento de dependências de runtime está esgotado.
dependencies = ["pyyaml>=6.0.1,<7"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.optional-dependencies]
# pytest < 9.0.3 carrega GHSA-6w46-j5rx-g56g / PYSEC-2026-1845 (manipulação
# vulnerável de /tmp/pytest-of-{user} em UNIX). O piso não pode ser afrouxado.
dev = [
    "pytest>=9.0.3,<10",
    # Um binário cobrindo lint + formatação. Substitui o trio isort/black/flake8 do
    # ggshield (Makefile:44) por uma dependência só — `rules/parsimony-ladder.md`
    # rung 4: não adicionar três ferramentas quando uma resolve.
    "ruff>=0.6,<1",
]

[project.urls]
# Sem isso, a página no PyPI não tem link para o código. Quem instala uma ferramenta de
# segurança quer poder ler o que ela faz antes de rodá-la no próprio repositório.
Repository = "https://github.com/paulohenriquevn/gitsafety"
Changelog = "https://github.com/paulohenriquevn/gitsafety/blob/main/CHANGELOG.md"
Issues = "https://github.com/paulohenriquevn/gitsafety/issues"

[project.scripts]
gitsafety = "gitsafety.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes — nomes indefinidos, imports não usados
    "I",       # isort
    "UP",      # pyupgrade — idiomas obsoletos para o target-version
    "B",       # flake8-bugbear — armadilhas reais, não estilo
    "SIM",     # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Testes podem usar `assert` livremente e importar fixtures de forma não convencional.
"tests/**" = ["S101"]
# O corpus limpo embute o CONTEÚDO de arquivos dentro de literais de string. Ali o
# comprimento da linha é dado — quebrá-lo mudaria o corpus que a métrica de falso
# positivo mede, e a métrica deixaria de ser comparável entre execuções.
"tests/fixtures/clean_corpus.py" = ["S101", "E501"]
